name: Build page manifest

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - ".github/scripts/build-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate manifest.json
        run: node .github/scripts/build-manifest.mjs

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- manifest.json; then
            git add manifest.json
            git commit -m "chore: update page manifest [skip ci]"
            git push
          else
            echo "No changes to manifest.json"
          fi
