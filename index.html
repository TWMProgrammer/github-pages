<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REDACTED &bull; Encrypted Resume</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(56, 189, 248, 0.22);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-glow: rgba(56, 189, 248, 0.22);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.1);
      --danger-border: rgba(244, 63, 94, 0.32);
      --success: #10b981;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #172554 0%, #090d16 75%);
      color: var(--text);
      font-family: var(--font-main);
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 38px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55), 0 0 35px var(--accent-glow);
      text-align: center;
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.32);
      border-radius: 9999px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .icon-container {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: var(--accent);
      font-size: 26px;
    }

    .spinner {
      border: 3.5px solid rgba(56, 189, 248, 0.15);
      border-top: 3.5px solid var(--accent);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    p.desc {
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    label {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(8, 12, 22, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #040914;
      font-weight: 600;
      font-size: 14px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
    }

    .alert-box {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 12.5px;
      line-height: 1.45;
      display: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      text-align: left;
      gap: 10px;
      align-items: flex-start;
    }

    .security-note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="badge"><i class="fa-solid fa-shield-halved"></i> Zero-Knowledge AES-256-GCM</div>
    <div class="icon-container" id="statusIcon">
      <div class="spinner"></div>
    </div>
    <h1 id="titleText">Decrypting Document...</h1>
    <p class="desc" id="descText">Verifying key in URL fragment and decrypting resume via in-memory Web Crypto.</p>

    <div class="input-group" id="manualForm" style="display: none;">
      <label for="keyInput"><i class="fa-solid fa-key"></i> 256-bit Decryption Key (64-character hex):</label>
      <input type="text" id="keyInput" placeholder="Paste 64-character hex key here..." autocomplete="off" spellcheck="false">
      <button class="btn-submit" id="unlockBtn" type="button">
        <i class="fa-solid fa-lock-open"></i> Unlock Resume
      </button>
    </div>

    <div class="alert-box" id="errorBox">
      <i class="fa-solid fa-triangle-exclamation" style="margin-top: 2px;"></i>
      <span id="errorMsg">Decryption failed.</span>
    </div>

    <div class="security-note">
      <i class="fa-solid fa-lock"></i>
      <span>Decryption happens in-memory client-side. The key is never sent across the network.</span>
    </div>
  </div>

  <script>
    (function() {
      const statusIcon = document.getElementById('statusIcon');
      const titleText = document.getElementById('titleText');
      const descText = document.getElementById('descText');
      const manualForm = document.getElementById('manualForm');
      const keyInput = document.getElementById('keyInput');
      const unlockBtn = document.getElementById('unlockBtn');
      const errorBox = document.getElementById('errorBox');
      const errorMsg = document.getElementById('errorMsg');

      function showFormState(msg, isError) {
        statusIcon.innerHTML = isError
          ? '<i class="fa-solid fa-circle-xmark" style="color: var(--danger);"></i>'
          : '<i class="fa-solid fa-lock" style="color: var(--accent);"></i>';
        titleText.textContent = isError ? 'Decryption Failed' : 'Protected Resume';
        descText.textContent = isError
          ? 'The provided decryption key is invalid or corrupted.'
          : 'Please enter the 256-bit key to decrypt and view this document.';
        
        if (msg) {
          errorMsg.textContent = msg;
          errorBox.style.display = 'flex';
        } else {
          errorBox.style.display = 'none';
        }
        manualForm.style.display = 'flex';
      }

      function base64ToUint8Array(base64) {
        const binStr = window.atob(base64);
        const len = binStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binStr.charCodeAt(i);
        }
        return bytes;
      }

      function hexToUint8Array(hex) {
        const cleanHex = hex.trim().replace(/^#/, '').toLowerCase();
        if (cleanHex.length !== 64 || !/^[0-9a-f]{64}$/.test(cleanHex)) {
          throw new Error('Key must be exactly 64 hexadecimal characters (256 bits).');
        }
        const bytes = new Uint8Array(32);
        for (let i = 0; i < 32; i++) {
          bytes[i] = parseInt(cleanHex.substr(i * 2, 2), 16);
        }
        return bytes;
      }

      async function decryptAndRender(hexKey) {
        try {
          const rawKey = hexToUint8Array(hexKey);
          const payloadElement = document.getElementById('encryptedPayload');
          if (!payloadElement) throw new Error('Encrypted payload is missing.');
          const payload = JSON.parse(payloadElement.textContent);

          const iv = base64ToUint8Array(payload.iv);
          const ciphertextWithTag = base64ToUint8Array(payload.data);

          const cryptoKey = await window.crypto.subtle.importKey(
            'raw',
            rawKey,
            { name: 'AES-GCM' },
            false,
            ['decrypt']
          );

          const decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv },
            cryptoKey,
            ciphertextWithTag
          );

          const plaintext = new TextDecoder('utf-8').decode(decryptedBuffer);

          // Render the decrypted HTML in a full-viewport iframe so the shell
          // page's URL (and the key in the fragment) never changes.
          const blob = new Blob([plaintext], { type: 'text/html; charset=utf-8' });
          const blobUrl = URL.createObjectURL(blob);

          const iframe = document.createElement('iframe');
          iframe.src = blobUrl;
          iframe.setAttribute('title', 'Decrypted Resume');
          iframe.style.cssText = 'position:fixed; inset:0; width:100%; height:100%; border:0; z-index:9999;';
          iframe.addEventListener('load', () => URL.revokeObjectURL(blobUrl), { once: true });

          document.body.innerHTML = '';
          document.body.style.cssText = 'margin:0; padding:0;';
          document.body.appendChild(iframe);
        } catch (err) {
          console.error(err);
          showFormState(err.message || 'Decryption failed: authentication tag mismatch or invalid key.', true);
        }
      }

      unlockBtn.addEventListener('click', () => {
        const val = keyInput.value.trim();
        if (!val) {
          showFormState('Please enter a 64-character hexadecimal key.', true);
          return;
        }
        statusIcon.innerHTML = '<div class="spinner"></div>';
        titleText.textContent = 'Decrypting Document...';
        descText.textContent = 'Verifying key and decrypting payload...';
        errorBox.style.display = 'none';
        decryptAndRender(val);
      });

      keyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') unlockBtn.click();
      });

      // Check URL fragment for key: #<64-hex-chars>
      const hash = window.location.hash.replace(/^#/, '').trim();
      if (hash) {
        if (/^[0-9a-fA-F]{64}$/.test(hash)) {
          decryptAndRender(hash);
        } else {
          showFormState('Invalid key in URL fragment: expected 64 hex characters.', true);
        }
      } else {
        showFormState('', false);
      }
    })();
  </script>
