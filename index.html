<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REDACTED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(56, 189, 248, 0.22);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-glow: rgba(56, 189, 248, 0.22);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #172554 0%, #090d16 75%);
      color: var(--text);
      font-family: var(--font-main);
      padding: 48px 24px;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      max-width: 720px;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55), 0 0 35px var(--accent-glow);
      overflow: hidden;
    }

    ul#toc {
      list-style: none;
    }

    ul#toc li + li {
      border-top: 1px solid var(--card-border);
    }

    ul#toc a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      color: var(--text);
      text-decoration: none;
      transition: background 0.15s ease;
    }

    ul#toc a:hover {
      background: rgba(56, 189, 248, 0.08);
    }

    ul#toc a:hover .title {
      color: var(--accent);
    }

    ul#toc i.icon {
      color: var(--accent);
      font-size: 16px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .meta { flex: 1; min-width: 0; }

    .title {
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .path {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    i.chevron {
      color: var(--text-muted);
      font-size: 12px;
      flex-shrink: 0;
    }

    .status {
      padding: 32px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--danger);
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>REDACTED</h1>
      <p>Index of published pages</p>
    </header>

    <div class="card">
      <ul id="toc"></ul>
      <div class="status" id="status">Loading pages&hellip;</div>
    </div>

    <footer id="generated"></footer>
  </div>

  <script>
    async function loadManifest() {
      const list = document.getElementById('toc');
      const status = document.getElementById('status');
      const generated = document.getElementById('generated');

      try {
        const res = await fetch('manifest.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('manifest.json not found (status ' + res.status + ')');
        const data = await res.json();
        const pages = Array.isArray(data.pages) ? data.pages : [];

        if (pages.length === 0) {
          status.textContent = 'No pages found yet.';
          return;
        }

        for (const page of pages) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = page.path;

          const icon = document.createElement('i');
          icon.className = 'icon fa-solid fa-file-lines';

          const meta = document.createElement('div');
          meta.className = 'meta';

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = page.title || page.path;

          const path = document.createElement('div');
          path.className = 'path';
          path.textContent = page.path;

          meta.appendChild(title);
          meta.appendChild(path);

          const chevron = document.createElement('i');
          chevron.className = 'chevron fa-solid fa-chevron-right';

          a.appendChild(icon);
          a.appendChild(meta);
          a.appendChild(chevron);
          li.appendChild(a);
          list.appendChild(li);
        }

        status.remove();

        if (data.generated) {
          const d = new Date(data.generated);
          generated.textContent = 'Last updated ' + d.toLocaleString();
        }
      } catch (err) {
        status.textContent = 'Could not load page list: ' + err.message;
        status.classList.add('error');
      }
    }

    loadManifest();
  </script>
</body>
</html>
